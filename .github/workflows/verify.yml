name: Verify shop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: shiguang_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-test-only-password
          MYSQL_ROOT_PASSWORD: ci-root-test-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/shiguang_ci?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
      MYSQL_TEST_USER: ci
      MYSQL_TEST_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build Vue frontend
        working-directory: frontend
        run: pnpm exec vite build
      - name: Verify timestamp display
        working-directory: frontend
        run: node --test test/format.test.js
      - name: Verify local SMTP inbox
        run: python3 scripts/test_mail_capture.py
      - name: Verify Spring Boot backend
        working-directory: backend
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: shiguang-shop-jar
          path: backend/target/shop-0.1.0.jar
          retention-days: 7
      - name: Build deployment image
        run: docker build -t shiguang-shop:ci .
      - name: Start SMTP test inbox
        run: |
          mkdir -p .local
          python3 scripts/mail_capture.py > .local/smtp-ci.log 2>&1 &
      - name: Run built application with MySQL
        env:
          SHOP_TEST_ADMIN_PASSWORD: Ci-Test-Only-Admin-2026
          SHOP_TEST_CUSTOMER_PASSWORD: Ci-Test-Only-Customer-2026
        run: |
          docker run -d --name shiguang-ci --network host -e SERVER_ADDRESS=127.0.0.1 -e PORT=18081 -e DB_URL="$MYSQL_TEST_URL" -e DB_USERNAME="$MYSQL_TEST_USER" -e DB_PASSWORD="$MYSQL_TEST_PASSWORD" -e DEMO_ADMIN_PASSWORD="$SHOP_TEST_ADMIN_PASSWORD" -e DEMO_CUSTOMER_PASSWORD="$SHOP_TEST_CUSTOMER_PASSWORD" -e DEMO_SEED_ORDERS=true shiguang-shop:ci
          python3 - <<'PY'
          import json,time,urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18081/api/health',timeout=2) as response:
                      if json.load(response).get('status')=='UP':
                          print('Built image is ready with MySQL');break
              except OSError: pass
              time.sleep(1)
          else: raise SystemExit('Deployment image did not become ready')
          PY
      - name: Verify container shopping and SMTP flow
        env:
          SHOP_TEST_BASE: http://127.0.0.1:18081/api
          SHOP_TEST_ADMIN_PASSWORD: Ci-Test-Only-Admin-2026
          SHOP_TEST_CUSTOMER_PASSWORD: Ci-Test-Only-Customer-2026
        run: python3 scripts/smoke_test.py
      - name: Save deployment runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: deployment-runtime-evidence
          path: |
            .local/smoke-report.json
            .local/mailbox/
          retention-days: 7
      - name: Deployment test logs and cleanup
        if: always()
        run: |
          docker logs shiguang-ci || true
          docker rm -f shiguang-ci || true
